name: Build checks

# Runs on a Mac so the iOS code is compiled too. Only one teammate has Xcode locally,
# so this is the safety net that catches iOS breakage on every pull request.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # gradle/gradle-daemon-jvm.properties asks for Azul (Zulu) JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Android debug build
        run: ./gradlew :androidApp:assembleDebug

      - name: iOS compile (simulator)
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64

      - name: Shared tests (Android host)
        run: ./gradlew :shared:testAndroidHostTest
